<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lucky Draw Bowl</title>
<style>
  * { box-sizing: border-box; }
  body {
    min-height: 100vh; margin: 0; padding: 28px;
    display: grid; place-items: center;
    font-family: Arial, sans-serif; color: #20253a;
    background: radial-gradient(circle at top, #fff, #e6eaf4 70%);
  }
  main { width: min(620px, 100%); text-align: center; }
  h1 { margin-bottom: 8px; }
  textarea {
    width: 100%; height: 100px; padding: 13px;
    border: 1px solid #cbd1df; border-radius: 12px;
    font: inherit; resize: vertical;
  }
  button {
    margin: 10px 5px; padding: 12px 18px; border: 0;
    border-radius: 10px; background: #514fe0; color: white;
    font-size: 15px; font-weight: bold; cursor: pointer;
  }
  button:disabled { opacity: .5; cursor: not-allowed; }

  .stage {
    height: 330px; margin: 20px auto 0;
    display: flex; align-items: end; justify-content: center;
    position: relative; perspective: 700px;
  }
  .bowl {
    position: relative; width: 320px; height: 195px;
    border: 10px solid rgba(91, 121, 173, .75);
    border-top: 0; border-radius: 0 0 160px 160px;
    background: linear-gradient(135deg,
      rgba(255,255,255,.72), rgba(153,190,230,.34) 55%,
      rgba(255,255,255,.68));
    box-shadow: inset 0 -18px 24px rgba(64,92,140,.18),
                0 18px 25px rgba(48,59,90,.16);
    transform-origin: 50% 12%;
    overflow: visible;
  }
  .bowl::after {
    content: ""; position: absolute; left: 6%; right: 6%; bottom: 7px;
    height: 22px; border-radius: 50%;
    border: 3px solid rgba(255,255,255,.65);
  }
  .rim {
    position: absolute; width: 100%; height: 34px; left: 0; top: -17px;
    border-radius: 50%;
    border: 9px solid rgba(91,121,173,.82);
    background: rgba(238,246,255,.72);
  }
  .lid {
    position: absolute; z-index: 5; width: 160px; height: 24px;
    top: -42px; left: 70px; border-radius: 50%;
    background: linear-gradient(#aebbe3, #707fbd);
    border: 4px solid #6776ad;
    transform-origin: 12% 50%;
    transition: transform .65s ease;
  }
  .lid::before {
    content: ""; position: absolute; width: 38px; height: 12px;
    left: 56px; top: -12px; border-radius: 12px 12px 3px 3px;
    background: #707fbd;
  }
  .bowl.open .lid { transform: rotate(-70deg) translate(-12px, -30px); }

  .ball {
    position: absolute; width: 58px; height: 58px; border-radius: 50%;
    display: grid; place-items: center; padding: 5px;
    color: #34324e; font-size: 11px; font-weight: bold;
    overflow-wrap: anywhere; text-align: center;
    border: 2px solid rgba(255,255,255,.95);
    background: radial-gradient(circle at 30% 25%, #fff 0 10%, #ffe78a 35%, #f2a62d 100%);
    box-shadow: inset -5px -7px 10px rgba(145,86,4,.22),
                0 4px 7px rgba(31,44,70,.22);
    transition: left .45s, top .45s, transform .45s, opacity .35s;
  }
  .ball.winner {
    z-index: 10; left: 50% !important; top: -115px !important;
    transform: translateX(-50%) scale(1.35) !important;
    animation: pop .7s ease-out;
  }
  @keyframes pop {
    0% { top: 30px; opacity: .4; }
    65% { top: -135px; }
    100% { top: -115px; opacity: 1; }
  }
  .bowl.spinning { animation: spin 1.5s ease-in-out; }
  @keyframes spin {
    0% { transform: rotate(0); }
    25% { transform: rotate(10deg); }
    55% { transform: rotate(-9deg); }
    80% { transform: rotate(5deg); }
    100% { transform: rotate(0); }
  }
  #result { min-height: 34px; margin-top: 20px; font-size: 22px; font-weight: bold; }
  #status { color: #687086; }
</style>
</head>
<body>
<main>
  <h1>Lucky Draw</h1>
  <p>Enter names separated by commas or put each name on a new line.</p>
  <textarea id="nameInput" placeholder="Avery&#10;Jordan&#10;Sam"></textarea>
  <div>
    <button id="fillButton">Put names in bowl</button>
    <button id="drawButton" disabled>Spin and draw</button>
  </div>

  <div class="stage">
    <div class="bowl" id="bowl">
      <div class="lid"></div>
      <div class="rim"></div>
    </div>
  </div>
  <div id="result" aria-live="polite"></div>
  <div id="status">The bowl is empty.</div>
</main>

<script>
  const bowl = document.querySelector("#bowl");
  const input = document.querySelector("#nameInput");
  const drawButton = document.querySelector("#drawButton");
  const result = document.querySelector("#result");
  const status = document.querySelector("#status");

  let names = [];
  let isDrawing = false;

  function placeBalls() {
    bowl.querySelectorAll(".ball").forEach(ball => ball.remove());

    names.forEach((name, index) => {
      const ball = document.createElement("div");
      ball.className = "ball";
      ball.textContent = name;

      // Keep the balls inside the bowl and spread them around.
      const maxLeft = Math.max(10, bowl.clientWidth - 75);
      const maxTop = Math.max(15, bowl.clientHeight - 80);
      ball.style.left = `${10 + Math.random() * maxLeft}px`;
      ball.style.top = `${20 + Math.random() * maxTop}px`;
      ball.style.transform = `rotate(${Math.random() * 30 - 15}deg)`;
      ball.style.zIndex = String(index + 1);

      bowl.appendChild(ball);
    });
  }

  document.querySelector("#fillButton").addEventListener("click", () => {
    names = input.value.split(/[\n,]+/).map(name => name.trim()).filter(Boolean);
    result.textContent = "";
    bowl.classList.remove("open");
    placeBalls();

    status.textContent = names.length
      ? `${names.length} ball${names.length === 1 ? "" : "s"} in the bowl.`
      : "The bowl is empty.";

    drawButton.disabled = names.length === 0;
  });

  drawButton.addEventListener("click", () => {
    if (!names.length || isDrawing) return;
    isDrawing = true;
    drawButton.disabled = true;
    result.textContent = "";
    bowl.classList.remove("open");

    bowl.classList.remove("spinning");
    void bowl.offsetWidth;
    bowl.classList.add("spinning");

    setTimeout(() => {
      bowl.classList.remove("spinning");
      bowl.classList.add("open");

      const pickedIndex = Math.floor(Math.random() * names.length);
      const pickedName = names[pickedIndex];
      const balls = bowl.querySelectorAll(".ball");
      const pickedBall = balls[pickedIndex];

      pickedBall.classList.add("winner");
      result.textContent = `🎉 ${pickedName}!`;

      setTimeout(() => {
        pickedBall.remove();
        names.splice(pickedIndex, 1);
        status.textContent = `${names.length} ball${names.length === 1 ? "" : "s"} left.`;
        drawButton.disabled = names.length === 0;
        isDrawing = false;
      }, 1100);
    }, 1500);
  });
</script>
</body>
</html>
